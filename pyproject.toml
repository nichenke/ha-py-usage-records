[tool.poetry]
name = "ha-usage-records"
version = "0.1.0"
description = ""
authors = ["Nic Henke <nichenke@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.9"
uvicorn = ">=0.34.0,<0.35.0"
wsproto = ">=1.2.0,<2.0.0"
pydantic = ">=2.10.5,<3.0.0"
logfire = {version = ">=3.2.0,<4.0.0", extras = ["fastapi"]}
fastapi = ">=0.115.12,<0.116.0"

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
pytest = "^8.3.4"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.logfire]
pydantic_plugin_record = "all"

